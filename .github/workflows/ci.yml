name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['v*', '[0-9]+.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: christianlouis/docuelevate
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Stage 1: Static Analysis (Fast Fail Gates)
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Ruff
        run: pip install ruff
      - name: Check for merge conflict markers
        run: |
          if git grep -rn -E '^(<{7} |>{7} |={7}$)' -- '.'; then
            echo "ERROR: Merge conflict markers found."
            exit 1
          fi
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  migration-chain:
    name: Alembic Migration Chain Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate migration chain
        run: python scripts/check_alembic_migrations.py

  html-lint:
    name: HTML Accessibility Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      # The H043/H053 template migration is validated against djLint 1.46.4.
      - run: pip install djlint==1.46.4
      - run: djlint frontend/templates/ --lint

  terraform-validate:
    name: Terraform Deployment Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive examples/terraform
      - name: Initialize providers without a backend
        run: terraform -chdir=examples/terraform/kubernetes init -backend=false -input=false
      - name: Validate the Kubernetes deployment module
        run: terraform -chdir=examples/terraform/kubernetes validate

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 2: Parallel Heavy Lifters (Consolidated for Efficiency)
  # ══════════════════════════════════════════════════════════════════════════
  
  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements-dev.txt
      - run: mypy app/

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install pip-audit>=2.7.0
      - run: pip-audit -r requirements.txt --desc on --ignore-vuln CVE-2026-4539

  mobile-checks:
    name: Mobile Lockfile & Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies from lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Check mobile lint
        working-directory: mobile
        run: npm run lint
      - name: Check mobile types
        working-directory: mobile
        run: npm run type-check

  run-tests:
    name: Execute All Tests (Quick + Integration)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672", "15672:15672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: >
          pytest tests/ -v --timeout=300
          --cov=app --cov-report=xml:coverage.xml
          --junitxml=junit.xml -o junit_family=legacy
          -m "not e2e"

      - name: Run browser upload queue tests
        run: |
          node --test frontend/static/js/upload-*.test.js
          node --test tests/test_dom_text_runtime.cjs
          node --test tests/test_google_drive_oauth_selector.cjs

      - name: Upload Unified Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  # ══════════════════════════════════════════════════════════════════════════
  # Stage 3: Build & Push (Quality Gate)
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [run-tests, mypy, dependency-scan, mobile-checks, html-lint, migration-chain, terraform-validate]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The release workflow creates an annotated version tag on a direct
          # child of this merge commit. Fetching tags lets the image build use
          # that authoritative version instead of the previous VERSION file.
          fetch-depth: 0
          fetch-tags: true
      - name: Generate Build Metadata
        id: build_metadata
        run: |
          chmod +x scripts/generate_build_metadata.sh
          chmod +x scripts/resolve_release_version.sh
          RESOLVED_RELEASE_VERSION=""
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # Semantic Release runs in parallel and normally finishes well
            # before tests unlock this build. Retry briefly to close the race.
            for attempt in {1..12}; do
              git fetch --force --tags origin
              NEW_VERSION="$(scripts/resolve_release_version.sh "${GITHUB_SHA}")"
              if [[ -n "${NEW_VERSION}" ]]; then
                export NEW_VERSION
                RESOLVED_RELEASE_VERSION="${NEW_VERSION}"
                echo "Using release version ${NEW_VERSION} for image metadata"
                break
              fi
              sleep 5
            done
            if [[ -z "${NEW_VERSION}" ]]; then
              REMOTE_VERSION="$(git show origin/main:VERSION | tr -d '\n')"
              LOCAL_VERSION="$(tr -d '\n' < VERSION)"
              if [[ "${REMOTE_VERSION}" != "${LOCAL_VERSION}" ]]; then
                echo "Release metadata advanced to ${REMOTE_VERSION}, but no matching release tag was resolved"
                exit 1
              fi
            fi
          fi
          ./scripts/generate_build_metadata.sh
          echo "version=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "release_version=${RESOLVED_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/docuelevate
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.build_metadata.outputs.release_version }},enable=${{ steps.build_metadata.outputs.release_version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.build_metadata.outputs.version }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
